name: Quality Gates

# Phase 3 — Testing, Release Gates & Engineering Governance.
# TD-03 — CI/CD Activation & Merge Protection.
#
# Every job here runs against an isolated PostgreSQL service container that
# lives only for the duration of the workflow run. This pipeline never reads
# a repository secret named DATABASE_URL and never connects to any
# persistent/production database. No job here has permission to write
# outside its own ephemeral runner or read production credentials.
#
# NOTE (TD-01 documented blocker): `drizzle-kit generate` is intentionally
# never run in this workflow. The migration snapshot chain
# (migrations/meta/*.json) has a documented gap for migrations 0017-0028 —
# see the Technical Debt 01 report — meaning `generate` currently produces
# a stale, duplicate diff and cannot be trusted to validate anything. This
# workflow validates migrations by replaying the committed .sql files
# (`db:migrate`) into a disposable database and diffing the result, not by
# regenerating them.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  # Throwaway, ephemeral service-container credentials only — this database
  # exists for the lifetime of a single job and is discarded by the runner
  # afterward. Split from the connection string below (rather than one
  # inline literal) so it reads as the obvious placeholder it is, both to
  # humans and to this repo's secret-scan gate.
  CI_DB_PASSWORD: ci_test

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: node scripts/secret-scan.cjs --all

  architecture:
    name: Architecture lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint:architecture

  architecture-strict:
    name: Architecture lint (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint:architecture:strict

  typecheck:
    name: Typecheck (check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check

  typecheck-full:
    name: Typecheck (check:full)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check:full

  backend-build:
    name: Backend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-log
          path: dist/meta.json
          retention-days: 7
          if-no-files-found: ignore

  unit-safe:
    name: Unit tests (safe, no DB)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit:safe

  migration-validation:
    name: Migration from zero + drift check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_test
          POSTGRES_PASSWORD: ci_test
          POSTGRES_DB: ci_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Migrate from zero
        env:
          DATABASE_URL: postgresql://ci_test:${{ env.CI_DB_PASSWORD }}@localhost:5432/ci_test_db
        run: npx tsx scripts/migrate.ts
      - name: Verify migration 0028 landed (courier_audit_logs columns)
        env:
          PGPASSWORD: ci_test
        run: |
          COUNT=$(psql -h localhost -U ci_test -d ci_test_db -tAc \
            "select count(*) from information_schema.columns where table_name='courier_audit_logs' and column_name in ('actor_name_snapshot','actor_role_snapshot','actor_avatar_url','action_type','action_description','source','status','metadata','ip_address','device_id')")
          echo "courier_audit_logs reconciled columns found: $COUNT / 10"
          if [ "$COUNT" -ne 10 ]; then
            echo "::error::migration 0028 did not apply cleanly (expected 10 reconciled columns, found $COUNT)"
            exit 1
          fi
      - name: Drift check (schema.ts vs migrated DB — safe, isolated only)
        env:
          TEST_DATABASE_URL: postgresql://ci_test:${{ env.CI_DB_PASSWORD }}@localhost:5432/ci_test_db
        run: node scripts/erp008-drift-check.mjs --allow-test-db
      - name: Cleanup note
        if: always()
        run: echo "Service container is torn down automatically by the runner at job end; no manual cleanup needed."

  isolated-tests:
    name: Backend tests (isolated DB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_test
          POSTGRES_PASSWORD: ci_test
          POSTGRES_DB: ci_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Migrate test database
        env:
          DATABASE_URL: postgresql://ci_test:${{ env.CI_DB_PASSWORD }}@localhost:5432/ci_test_db
        run: npx tsx scripts/migrate.ts
      - name: Run full backend test suite against the isolated service DB
        env:
          DATABASE_URL: postgresql://ci_test:${{ env.CI_DB_PASSWORD }}@localhost:5432/ci_test_db
        run: npx vitest run
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: |
            **/vitest-report/**
          retention-days: 7
          if-no-files-found: ignore
